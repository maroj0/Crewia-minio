server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    # MinIO Console (UI) — debe ir ANTES de location /
    location = /minio {
        return 301 /minio/;
    }

    location /minio/ {
        proxy_pass http://minio:9001/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /minio;

        # WebSocket (consola)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;

        # La consola redirige a rutas absolutas en / — corregirlas a /minio/
        proxy_redirect / /minio/;
        proxy_redirect ~^https?://[^/]+/(.*)$ /minio/$1;

        # SPA: fuerza base path para assets relativos
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<head>' '<head><base href="/minio/">';
        sub_filter 'href="/' 'href="/minio/';
        sub_filter 'src="/' 'src="/minio/';
    }

    # API FastAPI (Swagger en /, jobs, etc.)
    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
    }
}
