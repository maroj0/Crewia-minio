services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa
      POSTGRES_DB: qa
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d qa"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://qa:qa@postgres:5432/qa
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: qa-crew
      MINIO_SECURE: "false"
      MINIO_PRESIGN_EXPIRY_HOURS: "1"
      JOBS_WORKSPACE_ROOT: /tmp/jobs
      MAX_CONCURRENT_JOBS: "1"
      OLLAMA_BASE_URL: http://100.126.36.101:11434
      API_BASE: http://100.126.36.101:11434
      MODEL: ollama/qwen2.5-coder:3b
      OPENAI_API_KEY: ollama
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - jobs_workspace:/tmp/jobs

volumes:
  postgres_data:
  minio_data:
  jobs_workspace:
